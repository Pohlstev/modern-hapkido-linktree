<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Modern Hapkido</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Modern Hapkido — Hanau &amp; Erlensee. Alle Kanäle auf einen Blick." />

    <!-- Open Graph -->
    <meta property="og:title" content="Modern Hapkido" />
    <meta property="og:description" content="Website, Instagram und German Open 2027 — alle Links." />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="lt-page">

      <!-- Header -->
      <header class="lt-header">
        <div class="lt-logo">
          <img
            src="assets/img/logo/Modern-Hapkido-Logo-Transparent-Black.png"
            alt="Modern Hapkido Logo"
          />
        </div>
        <h1 class="lt-title">Modern<br />Hapkido</h1>
        <p class="lt-subtitle">Hapkido · Hanau &amp; Erlensee</p>
      </header>

      <!-- Links -->
      <nav class="lt-links" aria-label="Links">

        <a
          class="lt-link"
          href="https://www.modern-hapkido.de/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="lt-link-inner">
            <span class="lt-link-label">Vereinswebsite</span>
            <span class="lt-link-name">modern-hapkido.de</span>
          </div>
          <span class="lt-link-arrow">→</span>
        </a>

        <a
          class="lt-link"
          href="https://www.instagram.com/official.modern.hapkido/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="lt-link-inner">
            <span class="lt-link-label">Instagram</span>
            <span class="lt-link-name">@official.modern.hapkido</span>
          </div>
          <span class="lt-link-arrow">→</span>
        </a>

        <!-- Event Section -->
        <div class="lt-divider">
          <span class="lt-divider-label">German Open Hapkido 2027</span>
        </div>

        <a
          class="lt-link lt-link--event"
          href="https://go-hapkido.de"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="lt-link-inner">
            <span class="lt-link-label">Veranstaltung · 05–06 Juni 2027</span>
            <span class="lt-link-name">go-hapkido.de</span>
          </div>
          <span class="lt-link-arrow">→</span>
        </a>

        <a
          class="lt-link lt-link--event"
          href="https://sponsoring.go-hapkido.de"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="lt-link-inner">
            <span class="lt-link-label">Sponsoring &amp; Partnerschaften</span>
            <span class="lt-link-name">Partner werden →</span>
          </div>
          <span class="lt-link-arrow">→</span>
        </a>

      </nav>

      <!-- Footer -->
      <footer class="lt-footer">
        <p>© 2026 Modern Hapkido · TG Hanau · TSG Erlensee</p>
      </footer>

    </div>
  </body>
</html>
